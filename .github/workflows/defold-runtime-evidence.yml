name: HTML5 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up OpenJDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
          cache: ""

      - name: Install pinned visual QA browser tooling
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tools/visual_qa/requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Prepare exact-source evidence
        run: |
          set -euo pipefail
          mkdir -p html5-ci
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > html5-ci/head-sha.txt

      - name: Build pinned development and release HTML5 bundles
        run: |
          set -euo pipefail
          java -version
          python3 tools/defold/bundle_html5.py --mode development
          python3 tools/defold/bundle_html5.py --mode release
          test -f build/html5/development/BeBee/index.html
          test -f build/html5/release/BeBee/index.html
          find build/html5/release/BeBee -type f -name '*.wasm' -print -quit | grep -q .

      - name: Smoke bundles and capture deterministic visual/storage QA
        run: |
          set -euo pipefail

          python3 scripts/serve_html5.py --root build/html5 --bind 127.0.0.1 --port 8000 >html5-ci/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/release/BeBee/ >/dev/null && curl --fail --silent --show-error http://127.0.0.1:8000/development/BeBee/ >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              cat html5-ci/http-server.log
              exit 1
            fi
            sleep 1
          done

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${browser}" ]; then
            echo "No Chromium-compatible browser found on runner" >&2
            exit 1
          fi

          python3 tools/defold/chromium_html5_smoke.py --browser "${browser}" --url http://127.0.0.1:8000/release/BeBee/ --output html5-ci/browser-smoke.json --browser-log html5-ci/browser.log

          if [ -f app/input_probe.collectionproxy ]; then
            python3 tools/defold/chromium_input_proxy_smoke.py --browser "${browser}" --url http://127.0.0.1:8000/development/BeBee/ --output html5-ci/input-proxy-smoke.json --browser-log html5-ci/input-browser.log
          else
            printf '%s\n' '{"schema_version":1,"result":"not_applicable","reason":"input proxy proof not present on this head"}' > html5-ci/input-proxy-smoke.json
          fi

          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 tools/visual_qa/capture_visual_qa.py \
            --head-sha "${head_sha}" \
            --state foundation_probe \
            --viewports desktop_reference,mobile_landscape \
            --repeat 2 \
            --output-root "artifacts/visual-qa/${head_sha}"

          mkdir -p "artifacts/storage-qa/${head_sha}"
          python3 tools/visual_qa/storage_html5_smoke.py \
            --development-url http://127.0.0.1:8000/development/BeBee/ \
            --release-url http://127.0.0.1:8000/release/BeBee/ \
            --report "artifacts/storage-qa/${head_sha}/storage-report.json"

          "${browser}" --headless=new --no-sandbox --disable-gpu --window-size=1280,720 --virtual-time-budget=5000 --screenshot=html5-ci/release-1280x720.png http://127.0.0.1:8000/release/BeBee/

          test -s html5-ci/release-1280x720.png
          test -s "artifacts/visual-qa/${head_sha}/foundation_probe/desktop_reference.png"
          test -s "artifacts/visual-qa/${head_sha}/foundation_probe/mobile_landscape.png"
          test -s "artifacts/visual-qa/${head_sha}/capture-report.json"
          test -s "artifacts/storage-qa/${head_sha}/storage-report.json"
          find build/html5/release/BeBee -type f -print0 | sort -z | xargs -0 sha256sum > html5-ci/release-files.sha256
          sha256sum html5-ci/release-1280x720.png > html5-ci/release-1280x720.sha256

      - name: Upload playable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: html5-playable-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: build/html5/release/BeBee

      - name: Upload deterministic visual QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-qa-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/visual-qa/${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload storage persistence QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-qa-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/storage-qa/${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload HTML5 CI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: html5-ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            html5-ci
            build/reports
