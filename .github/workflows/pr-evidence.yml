name: PR evidence bootstrap

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run adversarial evidence-policy tests
        run: python3 -m unittest discover -s scripts/policy_tests -p 'test_*.py' -v

      - name: Validate declared PR evidence structure and manifest
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_pr_evidence.py

      - name: Validate diff classification and anti-bypass policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_pr_evidence_policy.py

      - name: Open one-time bot-authored migration PR
        if: github.event.pull_request.number == 8 && github.event.pull_request.user.login == 'StrayForest'
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_HEAD: automation/autonomous-gate-migration
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if gh pr list --base main --head "$MIGRATION_HEAD" --state open --json number --jq 'length' | grep -qx '0'; then
            printf '%s\n' "$PR_BODY" > /tmp/migration-pr-body.md
            gh pr create \
              --base main \
              --head "$MIGRATION_HEAD" \
              --title "ci: make trusted evidence gate autonomous" \
              --body-file /tmp/migration-pr-body.md
          fi
