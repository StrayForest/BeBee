name: P6 compact view payload

on:
  push:
    branches:
      - codex/p6-first-region-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove static patch metadata from per-frame GUI message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gameplay/bee/movement_field.script')
          text = path.read_text()
          for line in [
              '    payload[prefix .. "x"] = state.definition.x\n',
              '    payload[prefix .. "y"] = state.definition.y\n',
              '    payload[prefix .. "flower_id"] = state.definition.flower_id\n',
              '    payload[prefix .. "meadow_id"] = state.definition.meadow_id\n',
              '    payload[prefix .. "eligible"] = progression.is_patch_eligible(self.save_state, state.definition)\n',
          ]:
              assert text.count(line) == 1, (line, text.count(line))
              text = text.replace(line, '', 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameplay/bee/movement_field.script
          git commit -m "P6: keep GUI frame payload under Defold message limit"
          git push origin HEAD:codex/p6-first-region-vertical-slice
