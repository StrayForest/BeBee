name: P6 fix clean region fixture

on:
  push:
    branches:
      - codex/p6-first-region-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep P6 reset lifecycle clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gameplay/bee/movement_field.script')
          lines = path.read_text().splitlines(keepends=True)
          output = []
          patched = 0
          index = 0
          while index < len(lines):
              line = lines[index]
              if (
                  line.strip() == 'elseif self.qa_state == REGION_START then'
                  and index + 1 < len(lines)
                  and lines[index + 1].strip() == 'prepare_region_fixture(self, 0)'
              ):
                  indent = line[:len(line) - len(line.lstrip())]
                  output.append(line)
                  output.append(indent + '    if lifecycle ~= "reset" then\n')
                  output.append(indent + '        prepare_region_fixture(self, 0)\n')
                  output.append(indent + '    end\n')
                  index += 2
                  patched += 1
                  continue
              output.append(line)
              index += 1

          assert patched == 1, patched
          path.write_text(''.join(output))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameplay/bee/movement_field.script
          git commit -m "P6: keep clean-save region journey unseeded"
          git push origin HEAD:codex/p6-first-region-vertical-slice
