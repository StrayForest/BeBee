name: Test and data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up OpenJDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
          cache: ""

      - name: Install Defold headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenal1

      - name: Run deterministic tests and data validation
        run: bash scripts/test.sh

      - name: Upload test/data evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-data-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/test-results
            build/reports/tests.json
