name: PR evidence trusted

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted

      - name: Checkout exact PR head as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate

      - name: Run trusted adversarial evidence-policy tests
        working-directory: trusted
        run: python3 -m unittest discover -s scripts/policy_tests -p 'test_*.py' -v

      - name: Validate candidate with trusted base evidence structure
        working-directory: candidate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ../trusted/scripts/check_pr_evidence.py

      - name: Validate candidate with trusted diff policy
        working-directory: candidate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ../trusted/scripts/check_pr_evidence_policy_v2.py

      - name: Validate candidate with trusted trust-boundary overlay
        working-directory: candidate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ../trusted/scripts/check_trust_boundary_v2.py
