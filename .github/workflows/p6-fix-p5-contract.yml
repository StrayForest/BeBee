name: P6 fix P5 regression contract

on:
  push:
    branches:
      - codex/p6-first-region-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update P5 canonical fixture for save v4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/visual_qa/capture_seed_qa.py')
          text = path.read_text()
          old = 'if int(payload.get("saveVersion", -1)) != 3 or int(payload.get("honey", -1)) != 30:'
          new = 'if int(payload.get("saveVersion", -1)) != 4 or int(payload.get("honey", -1)) != 30:'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual_qa/capture_seed_qa.py
          git commit -m "P6: keep P5 seed regression compatible with save v4"
          git push origin HEAD:codex/p6-first-region-vertical-slice
