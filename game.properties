[bebee]
group = Runtime
title = BeBee Runtime
help = BeBee runtime, storage and deterministic QA settings.

qa_enabled.type = bool
qa_enabled.default = 0
qa_enabled.label = Enable deterministic QA bridge
qa_enabled.help = Development/CI-only HTML5 QA bridge and state injection. Release settings must keep this disabled.

build_commit_sha.type = string
build_commit_sha.default = unavailable
build_commit_sha.label = Build commit SHA
build_commit_sha.help = Exact source commit injected by the editor-independent build tool for runtime evidence provenance.

storage_application_id.type = string
storage_application_id.default = com.strayforest.bebee
storage_application_id.label = Storage application ID
storage_application_id.help = Stable sys.get_save_file application identifier. Changing this disconnects existing local saves.
